<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 2400 1200" role="img" aria-labelledby="title desc">
  <title id="title">بيت الريف - مشهد بناء فاخر في الإمارات</title>
  <desc id="desc">مشهد خلفية فاتح بدون كتابة، يظهر رجلاً إماراتياً أمام فيلا حديثة مع برج خليفة وخط أفق دبي وقت الشروق.</desc>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFF8E6"/>
      <stop offset="0.42" stop-color="#F9DFA7"/>
      <stop offset="1" stop-color="#F7F1E8"/>
    </linearGradient>
    <linearGradient id="sunGlow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFF7C8" stop-opacity="0.95"/>
      <stop offset="1" stop-color="#D4AF37" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="greenShade" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#164A22"/>
      <stop offset="1" stop-color="#082414"/>
    </linearGradient>
    <linearGradient id="villaFace" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F6EEDC"/>
      <stop offset="1" stop-color="#D9C7A6"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#23352A" stop-opacity="0.86"/>
      <stop offset="1" stop-color="#101B14" stop-opacity="0.92"/>
    </linearGradient>
    <filter id="softBlur" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="22"/>
    </filter>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#3B2A10" flood-opacity="0.22"/>
    </filter>
  </defs>

  <rect width="2400" height="1200" fill="url(#sky)"/>
  <circle cx="1120" cy="420" r="340" fill="url(#sunGlow)" opacity="0.9"/>
  <circle cx="1140" cy="440" r="82" fill="#FFF4C9" opacity="0.86" filter="url(#softBlur)"/>

  <path d="M0 742 C340 665 688 696 940 642 C1198 587 1374 638 1600 600 C1850 557 2130 610 2400 548 L2400 1200 L0 1200 Z" fill="#EAD8B4" opacity="0.55"/>
  <path d="M0 862 C374 790 718 820 1038 778 C1290 745 1545 766 1810 710 C2068 655 2268 680 2400 642 L2400 1200 L0 1200 Z" fill="#D7C196" opacity="0.45"/>

  <!-- Dubai skyline and Burj Khalifa -->
  <g opacity="0.72">
    <path d="M306 740 L306 360 L322 300 L338 360 L338 740 Z" fill="#56675E" opacity="0.55"/>
    <path d="M315 360 L322 78 L329 360 Z" fill="#384A43" opacity="0.62"/>
    <path d="M230 740 L230 575 L292 575 L292 740 Z" fill="#6C7A70" opacity="0.36"/>
    <path d="M358 740 L358 520 L414 520 L414 740 Z" fill="#6C7A70" opacity="0.32"/>
    <path d="M455 740 L455 610 L498 610 L498 740 Z" fill="#6C7A70" opacity="0.25"/>
    <path d="M520 740 L520 545 L590 545 L590 740 Z" fill="#6C7A70" opacity="0.22"/>
    <path d="M650 740 L650 625 L715 625 L715 740 Z" fill="#6C7A70" opacity="0.22"/>
  </g>

  <!-- palms -->
  <g fill="#315A2C" opacity="0.72">
    <path d="M2060 740 c-8-138 8-268 44-390 c19 132 22 260 4 390z"/>
    <path d="M2095 368 c-110 28-178 82-214 148 c94-50 159-71 244-76z"/>
    <path d="M2096 370 c98 19 188 65 262 138 c-92-41-177-58-252-52z"/>
    <path d="M2100 360 c-72-78-145-125-246-145 c80 84 155 134 243 164z"/>
    <path d="M2110 356 c92-80 173-124 288-150 c-74 88-167 143-282 172z"/>
    <path d="M1744 740 c-4-88 6-170 28-246 c14 86 18 170 8 246z"/>
    <path d="M1770 500 c-72 20-121 54-153 102 c62-31 109-44 171-48z"/>
    <path d="M1770 498 c62 8 125 39 187 90 c-64-23-124-33-177-28z"/>
  </g>

  <!-- modern villa -->
  <g filter="url(#shadow)">
    <path d="M1310 682 L1310 438 L1880 438 L1960 512 L1960 786 L1290 786 Z" fill="url(#villaFace)"/>
    <path d="M1225 786 L1225 595 L1506 595 L1506 786 Z" fill="#E8D9BE"/>
    <path d="M1482 438 L1482 318 L1774 318 L1774 438 Z" fill="#E9DCC6"/>
    <path d="M1460 306 L1806 306 L1824 330 L1440 330 Z" fill="#C7B08A"/>
    <path d="M1288 422 L1896 422 L1936 452 L1260 452 Z" fill="#BFA881"/>
    <rect x="1356" y="486" width="198" height="132" rx="8" fill="url(#glass)"/>
    <rect x="1600" y="486" width="240" height="132" rx="8" fill="url(#glass)"/>
    <rect x="1518" y="642" width="114" height="144" rx="4" fill="#173822"/>
    <rect x="1868" y="538" width="52" height="220" rx="4" fill="#172B20"/>
    <rect x="1520" y="354" width="86" height="68" rx="6" fill="url(#glass)"/>
    <rect x="1642" y="354" width="86" height="68" rx="6" fill="url(#glass)"/>
    <path d="M1202 786 L2050 786 L2110 836 L1160 836 Z" fill="#CDB790"/>
    <path d="M1358 836 L1900 836 L1940 878 L1320 878 Z" fill="#B99F76" opacity="0.8"/>
  </g>

  <!-- foreground garden -->
  <path d="M0 838 C310 790 568 825 812 802 C1100 774 1342 845 1630 816 C1920 786 2155 812 2400 774 L2400 1200 L0 1200 Z" fill="#295D2E" opacity="0.65"/>
  <path d="M0 908 C330 845 640 890 1008 858 C1300 834 1620 905 1928 846 C2130 808 2260 842 2400 820 L2400 1200 L0 1200 Z" fill="#1C4725" opacity="0.7"/>
  <path d="M560 960 C900 890 1210 900 1540 870 C1830 843 2110 840 2400 780 L2400 1200 L490 1200 Z" fill="#E3CE9E" opacity="0.72"/>
  <path d="M730 918 C1020 890 1378 886 1800 850" stroke="#F8E7BD" stroke-width="18" opacity="0.52" fill="none"/>

