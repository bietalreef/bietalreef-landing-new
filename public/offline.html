<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="theme-color" content="#0F3F1A" />
  <title>بيت الريف — لا يوجد اتصال</title>
  <style>
    *{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:#f8f4ec;color:#102f18;font-family:Arial,"Noto Sans Arabic",sans-serif;padding:24px}.card{width:min(100%,560px);background:#fff;border:1px solid #e6dcc8;border-radius:28px;padding:32px;text-align:center;box-shadow:0 24px 70px rgba(15,63,26,.14)}.icon{width:72px;height:72px;border-radius:22px;background:#fff2c8;display:grid;place-items:center;margin:auto;font-size:34px}h1{font-size:28px;margin:22px 0 12px}p{color:#5f6368;line-height:1.9;margin:0}.actions{display:grid;gap:12px;margin-top:26px}button,a{min-height:50px;border-radius:16px;border:0;padding:14px 18px;font-size:16px;font-weight:700;text-decoration:none;cursor:pointer}.primary{background:#102f18;color:#fff}.secondary{background:#fff9e8;color:#102f18;border:1px solid #d9c99d}
  </style>
</head>
<body>
  <main class="card">
    <div class="icon">📶</div>
    <h1>تعذر الاتصال بالإنترنت</h1>
    <p>تحقق من اتصالك ثم حاول مرة أخرى. عند عودة الشبكة سيعرض بيت الريف أحدث نسخة متاحة.</p>
    <div class="actions">
      <button class="primary" onclick="location.reload()">إعادة المحاولة</button>
      <a class="secondary" href="/">العودة إلى الرئيسية</a>
    </div>
  </main>
</body>
</html>
