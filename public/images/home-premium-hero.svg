    <path d="M248 782 C266 662 312 570 382 526 C450 485 538 515 566 592 C606 704 564 828 536 954 L250 954 C230 892 230 838 248 782 Z" fill="#F7F5EF"/>
    <path d="M384 506 C345 510 310 538 296 574 C338 562 405 562 468 590 C446 540 424 507 384 506 Z" fill="#EEE8DC"/>
    <path d="M308 560 C356 548 432 552 488 584 C502 592 504 610 492 618 C420 588 356 582 282 594 C268 582 282 566 308 560 Z" fill="#181C19"/>
    <path d="M430 612 C460 658 478 734 458 825 C444 888 436 922 430 954 L250 954 C232 846 270 704 326 632 C354 596 398 588 430 612 Z" fill="#F9F7F1"/>
    <path d="M512 620 C548 685 548 782 514 954 L430 954 C454 836 468 720 430 612 C462 610 492 612 512 620 Z" fill="#D8D2C8" opacity="0.74"/>
  </g>

  <!-- atmosphere overlay -->
  <rect width="2400" height="1200" fill="url(#sky)" opacity="0.08"/>
  <rect width="2400" height="1200" fill="none" stroke="#F3E5C8" stroke-width="1"/>
</svg>
